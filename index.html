<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mon Journal Actu</title>
  
  <!-- Configuration iPhone PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Journal Actu">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2965/2965318.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0; padding: 0;
      padding-top: env(safe-area-inset-top);
    }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e50914; padding-bottom: 15px; }
    h1 { margin: 0; font-size: 2em; font-weight: 800; color: white; }
    h2 { font-size: 1.4em; color: #e50914; margin-top: 30px; border-left: 4px solid #e50914; padding-left: 10px; }
    .card {
      background: #1e1e1e; border-radius: 12px; margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden;
      display: flex; flex-direction: column; border: 1px solid #2d2d2d;
    }
    .card-image-wrap { width: 100%; height: 200px; background: #2d2d2d; overflow: hidden; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 15px; }
    .card-title { margin: 0 0 10px 0; font-size: 1.15em; font-weight: bold; }
    .card-title a { color: white; text-decoration: none; }
    .card-title a:hover { color: #e50914; }
    .card-desc { font-size: 0.9em; color: #aaaaaa; line-height: 1.4; }
    .loading { text-align: center; color: #888; padding: 50px; font-size: 1.1em; }
    
    #btn-carousel {
      background: #e50914; color: white; border: none; padding: 12px 24px;
      border-radius: 25px; font-weight: bold; margin: 15px auto; display: block;
      cursor: pointer; box-shadow: 0 4px 10px rgba(229, 9, 20, 0.4); font-size: 0.95em;
    }
    
    /* Plein écran Carrousel */
    #carousel-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999; color: white;
    }
    .slide {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 60px 20px; box-sizing: border-box;
      background-size: cover; background-position: center; position: relative;
    }
    .slide::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0.4) 100%); z-index: 1;
    }
    .slide-content { position: relative; z-index: 2; background: rgba(20,20,20,0.85); padding: 20px; border-radius: 12px; border: 1px solid #333; }
    #close-carousel { position: absolute; top: 40px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; z-index: 10; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mon Journal Mobile</h1>
      <button id="btn-carousel">Mode Carrousel 🎠</button>
    </header>
    <div id="content"><div class="loading">Téléchargement des flux d'actualités sécurisés... ⏳</div></div>
  </div>

  <div id="carousel-overlay">
    <button id="close-carousel">✕</button>
    <div id="carousel-slide" style="width:100%; height:100%;"></div>
  </div>

  <script>
    // Liste des flux RSS
    const FEEDS = [
      { name: "France Info", url: "https://www.francetvinfo.fr/titres.rss" },
      { name: "Le Monde", url: "https://www.lemonde.fr/rss/une.xml" }
    ];

    let articlesGlobal = [];
    let carouselIndex = 0;
    let carouselActive = false;

    // Nettoyage rapide du texte
    function cleanText(text) {
      if (!text) return "";
      return text.replace(/<[^>]*>/g, "").trim();
    }

    async function loadFeeds() {
      const contentDiv = document.getElementById('content');
      articlesGlobal = [];
      let totalArticlesCharges = 0;

      for (let feed of FEEDS) {
        try {
          // INTERMÉDIAIRE ROBUSTE : Utilisation de l'API rss2json (gratuite et acceptée par Apple)
          const apiURL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
          const response = await fetch(apiURL);
          const data = await response.json();
          
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            // Créer le titre du journal
            const sectionTitle = document.createElement('h2');
            sectionTitle.innerText = feed.name;
            contentDiv.appendChild(sectionTitle);

            // On prend les 4 premiers articles du flux
            const maxItems = Math.min(data.items.length, 4);
            for (let i = 0; i < maxItems; i++) {
              const item = data.items[i];
              
              let title = item.title || "";
              let link = item.link || "#";
              let desc = cleanText(item.description || item.content || "");
              let img = item.enclosure?.link || item.thumbnail || "";

              // Si pas d'image détectée, on essaie d'extraire une image cachée dans la description
              if (!img && (item.description || item.content)) {
                const imgMatch = (item.description + item.content).match(/<img[^>]+src=["']([^"']+)["']/i);
                if (imgMatch) img = imgMatch[1];
              }

              if (desc.length > 120) desc = desc.substring(0, 120) + "...";

              if (title) {
                totalArticlesCharges++;
                articlesGlobal.push({ title, link, desc, img, source: feed.name });
                
                // Dessiner la carte sur l'iPhone
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                  ${img ? `<div class="card-image-wrap"><img class="card-img" src="${img}"></div>` : ''}
                  <div class="card-body">
                    <div class="card-title"><a href="${link}" target="_blank">${title}</a></div>
                    <p class="card-desc">${desc}</p>
                  </div>
                `;
                contentDiv.appendChild(card);
              }
            }
          }
        } catch (e) {
          console.log("Erreur de conversion sur le flux : " + feed.name);
        }
      }

      // Si vraiment TOUS les serveurs ont échoué, on utilise le plan B
      if (totalArticlesCharges === 0) {
        contentDiv.innerHTML = "<p style='text-align:center;color:#ff9f43;font-size:0.9em;margin-bottom:20px;'>⚠️ Mode démonstration (Impossible de joindre les serveurs).</p>";
        injectFakeData(contentDiv);
      } else {
        // Enlever le message de chargement résiduel si nécessaire
        const loader = contentDiv.querySelector('.loading');
        if (loader) loader.remove();
      }
    }

    function injectFakeData(contentDiv) {
      const fakeSources = ["France Info (Hors-ligne)", "Le Monde (Hors-ligne)"];
      fakeSources.forEach(source => {
        const sectionTitle = document.createElement('h2');
        sectionTitle.innerText = source;
        contentDiv.appendChild(sectionTitle);

        for (let i = 1; i <= 2; i++) {
          let title = `Article de test mobile numéro ${i}`;
          let desc = "Vos flux RSS réels arrivent ! En attendant, ce texte valide le bon fonctionnement de la structure et du Carrousel.";
          let img = i === 1 ? "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=500" : "https://images.unsplash.com/photo-1495020689067-958852a6565d?w=500";
          let link = "https://www.google.fr";

          articlesGlobal.push({ title, link, desc, img, source });
          
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-image-wrap"><img class="card-img" src="${img}"></div>
            <div class="card-body">
              <div class="card-title"><a href="${link}" target="_blank">${title}</a></div>
              <p class="card-desc">${desc}</p>
            </div>
          `;
          contentDiv.appendChild(card);
        }
      });
    }

    // Moteur du Carrousel
    function showSlide(index) {
      if (articlesGlobal.length === 0) return;
      if (index >= articlesGlobal.length) { carouselIndex = 0; index = 0; }
      const art = articlesGlobal[index];
      const container = document.getElementById('carousel-slide');
      
      container.innerHTML = `
        <div class="slide" style="background-image: url('${art.img || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=500'}')">
          <div class="slide-content">
            <span style="background:#e50914; padding:4px 10px; border-radius:4px; font-size:11px; font-weight:bold; text-transform:uppercase;">${art.source}</span>
            <h2 style="font-size:1.4em; margin:15px 0 10px 0; font-weight:800; line-height:1.3;">${art.title}</h2>
            <p style="font-size:0.9em; color:#ccc; margin-bottom:15px; line-height:1.4;">${art.desc}</p>
            <button onclick="window.open('${art.link}', '_blank')" style="background:white; color:black; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; font-size:0.9em; width:100%;">Lire l'article entier ↗</button>
          </div>
        </div>
      `;
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    document.getElementById('btn-carousel').addEventListener('click', async () => {
      if(articlesGlobal.length === 0) return;
      document.getElementById('carousel-overlay').style.display = 'block';
      carouselActive = true;
      carouselIndex = 0;
      showSlide(carouselIndex);
      
      while(carouselActive) {
        await sleep(3000);
        if(carouselActive) {
          carouselIndex++;
          showSlide(carouselIndex);
        }
      }
    });

    document.getElementById('close-carousel').addEventListener('click', () => {
      document.getElementById('carousel-overlay').style.display = 'none';
      carouselActive = false;
    });

    loadFeeds();
  </script>
</body>
</html>
