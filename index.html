<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mon Journal Actu</title>
  
  <!-- Balises indispensables pour que l'iPhone le reconnaisse comme une App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Journal Actu">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2965/2965318.png">

  <style>
    /* Version épurée et adaptée au tactile de l'iPhone */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      margin: 0; padding: 0;
      padding-top: env(safe-area-inset-top); /* Évite l'encoche de l'iPhone */
    }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e50914; padding-bottom: 15px; }
    h1 { margin: 0; font-size: 2em; font-weight: 800; }
    .card {
      background: white; border-radius: 12px; margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .card-image-wrap { width: 100%; height: 200px; background: #e9ecef; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 15px; }
    .card-title { margin: 0 0 10px 0; font-size: 1.2em; font-weight: bold; }
    .card-title a { color: #111; text-decoration: none; }
    .card-desc { font-size: 0.95em; color: #495057; line-height: 1.4; }
    .loading { text-align: center; color: #6c757d; padding: 50px; }
    
    /* Bouton Carrousel Mobile */
    #btn-carousel {
      background: #e50914; color: white; border: none; padding: 10px 20px;
      border-radius: 20px; font-weight: bold; margin: 10px auto; display: block;
      cursor: pointer;
    }
    
    /* Plein écran Carrousel */
    #carousel-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0a0a0a; z-index: 9999; color: white;
    }
    .slide {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 40px 20px; box-sizing: border-box;
      background-size: cover; background-position: center;
    }
    .slide-content { background: rgba(0,0,0,0.75); padding: 20px; border-radius: 12px; }
    #close-carousel { position: absolute; top: 40px; right: 20px; background: rgba(255,255,255,0.3); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mon Journal Mobile</h1>
      <button id="btn-carousel">Lancer le Carrousel Carousel 🎠</button>
    </header>
    <div id="content"><div class="loading">Chargement des flux RSS... 📰</div></div>
  </div>

  <!-- Carrousel National -->
  <div id="carousel-overlay">
    <button id="close-carousel">✕</button>
    <div id="carousel-slide" style="width:100%; height:100%;"></div>
  </div>

  <script>
    // Liste des flux (On utilise l'adresse HTTPS directe)
    const FEEDS = [
      { name: "Le Monde", url: "https://www.lemonde.fr/rss/une.xml" },
      { name: "France Info", url: "https://www.francetvinfo.fr/titres.rss" },
      { name: "Courrier International", url: "https://www.courrierinternational.com/feed/all/rss.xml" }
    ];

    let articlesGlobal = [];
    let carouselIndex = 0;
    let carouselActive = false;

    // Pour contourner le blocage CORS sur mobile, on utilise un proxy gratuit
    async function loadFeeds() {
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = '';
      articlesGlobal = [];

      for (let feed of FEEDS) {
        try {
          // Utilisation d'un proxy public indispensable pour les requêtes web/mobiles directes
          const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`);
          const data = await response.json();
          const text = data.contents;
          
          const items = text.match(/<item>[\s\S]*?<\/item>/g) || [];
          
          if(items.length > 0) {
            const sectionTitle = document.createElement('h2');
            sectionTitle.innerText = feed.name;
            contentDiv.appendChild(sectionTitle);
          }

          for (let i = 0; i < Math.min(items.length, 5); i++) {
            const item = items[i];
            let title = (item.match(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/) || [])[1] || "";
            let link = (item.match(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/) || [])[1] || "";
            let desc = (item.match(/<description>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/description>/) || [])[1] || "";
            let img = (item.match(/<enclosure[^>]*url=["'](.*?)["']/i) || item.match(/<media:content[^>]*url=["'](.*?)["']/i) || [])[1] || "";
            
            // Nettoyage rapide du HTML dans la description
            desc = desc.replace(/<[^>]*>/g, "").substring(0, 120) + "...";

            if (title && link) {
              articlesGlobal.push({ title, link, desc, img, source: feed.name });

              // Création de la carte HTML
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                ${img ? `<div class="card-image-wrap"><img class="card-img" src="${img}"></div>` : ''}
                <div class="card-body">
                  <div class="card-title"><a href="${link}" target="_blank">${title}</a></div>
                  <p class="card-desc">${desc}</p>
                </div>
              `;
              contentDiv.appendChild(card);
            }
          }
        } catch (e) {
          console.log("Erreur flux " + feed.name);
        }
      }
    }

    // Système Carrousel Mobile
    function showSlide(index) {
      if (articlesGlobal.length === 0) return;
      if (index >= articlesGlobal.length) { carouselIndex = 0; index = 0; }
      const art = articlesGlobal[index];
      const container = document.getElementById('carousel-slide');
      
      container.innerHTML = `
        <div class="slide" style="background-image: url('${art.img || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=500'}')">
          <div class="slide-content">
            <span style="background:#e50914; padding:3px 8px; border-radius:4px; font-size:12px;">${art.source}</span>
            <h2 style="font-size:1.5em; margin:10px 0;">${art.title}</h2>
            <p style="font-size:0.9em; color:#ccc;">${art.desc}</p>
            <button onclick="window.open('${art.link}', '_blank')" style="background:white; color:black; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; margin-top:10px;">Lire l'article</button>
          </div>
        </div>
      `;
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    document.getElementById('btn-carousel').addEventListener('click', async () => {
      if(articlesGlobal.length === 0) return;
      document.getElementById('carousel-overlay').style.display = 'block';
      carouselActive = true;
      carouselIndex = 0;
      showSlide(carouselIndex);
      
      while(carouselActive) {
        await sleep(3000);
        if(carouselActive) {
          carouselIndex++;
          showSlide(carouselIndex);
        }
      }
    });

    document.getElementById('close-carousel').addEventListener('click', () => {
      document.getElementById('carousel-overlay').style.display = 'none';
      carouselActive = false;
    });

    // Lancement automatique
    loadFeeds();
  </script>
</body>
</html>
